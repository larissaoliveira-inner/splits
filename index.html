<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#131418;-webkit-font-smoothing:antialiased}
a{color:inherit}a:hover{color:oklch(0.82 0.1 75)}
input,select,button,textarea{font-family:inherit}
input::placeholder{color:currentColor;opacity:.45}
input:focus,select:focus{outline:1.5px solid oklch(0.75 0.1 65);outline-offset:1px}
input[type=number]::-webkit-inner-spin-button{opacity:.35}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.28);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div style="--bg:#131418;--glow1:oklch(0.3 0.035 65);--glow2:oklch(0.25 0.03 250);--fg:#ECE7DE;--mute:rgba(236,231,222,.58);--card:rgba(255,255,255,.035);--cardB:rgba(255,255,255,.07);--line:rgba(255,255,255,.07);--ctl:rgba(255,255,255,.06);--ctlB:rgba(255,255,255,.14);--input:rgba(255,255,255,.05);--select:#1F2025;--track:rgba(255,255,255,.08);--heatMiss:rgba(236,231,222,.22);--past:rgba(236,231,222,.72);--acc:oklch(0.82 0.1 75);--onAcc:#1A1712;--miss:oklch(0.72 0.13 30);--rowOn:rgba(233,201,140,.07);--heroBg:linear-gradient(135deg, rgba(233,201,140,.10), rgba(255,255,255,.03) 55%);--heroB:rgba(255,255,255,.08);--heroFg:#ECE7DE;--heroMute:rgba(236,231,222,.58);--heroAcc:oklch(0.82 0.1 75);--heroTrack:rgba(255,255,255,.08);--navOnBg:rgba(255,255,255,.08);--navOnFg:#ECE7DE;--navDot:oklch(0.82 0.1 75);--strong:#ECE7DE;--onStrong:#131418">
<div style="{{ themeVars }}">
<div style="display:flex;height:100vh;color:var(--fg);font-family:Archivo,sans-serif;background:radial-gradient(1000px 560px at 85% -15%, var(--glow1) 0%, transparent 65%), radial-gradient(800px 560px at -5% 115%, var(--glow2) 0%, transparent 60%), var(--bg);transition:background .3s">

<aside style="width:228px;flex:none;display:flex;flex-direction:column;padding:28px 18px 22px;gap:32px;border-right:1px solid var(--line)">
<div style="display:flex;align-items:center;gap:12px;padding:0 10px">
<svg width="30" height="30" viewBox="0 0 28 28"><polygon points="1,27 1,21 7,21 7,15 13,15 13,9 19,9 19,3 27,3 27,27" style="fill:var(--fg)"></polygon><rect x="1" y="21" width="6" height="2" style="fill:var(--acc)"></rect><rect x="7" y="15" width="6" height="2" style="fill:var(--acc)"></rect><rect x="13" y="9" width="6" height="2" style="fill:var(--acc)"></rect><rect x="19" y="3" width="8" height="2" style="fill:var(--acc)"></rect></svg>
<div style="font-family:Archivo;font-stretch:125%;font-weight:500;font-size:19px;letter-spacing:.06em">SPLITS</div>
</div>
<nav style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<button onClick="{{ n.onClick }}" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;border-radius:999px;background:{{ n.bg }};color:{{ n.fg }};font-size:14px;font-weight:{{ n.weight }};text-align:left;cursor:pointer;transition:background .2s"><span style="width:6px;height:6px;border-radius:50%;background:{{ n.dot }}"></span>{{ n.label }}</button>
</sc-for>
</nav>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
<div style="padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--cardB);display:flex;flex-direction:column;gap:6px">
<div style="font-size:11px;letter-spacing:.12em;color:var(--mute)">CONSISTENCY · 30D</div>
<div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:34px;line-height:1">{{ consistency30 }}<span style="font-size:16px;color:var(--mute)">{{ consistencyUnit }}</span></div>
<div style="display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:4px"><sc-for list="{{ spark }}" as="s" hint-placeholder-count="14"><div title="{{ s.title }}" style="flex:1;height:{{ s.h }};min-height:2px;border-radius:2px;background:{{ s.bg }}"></div></sc-for></div>
</div>
<button onClick="{{ toggleTheme }}" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:999px;border:1px solid var(--ctlB);background:var(--ctl);color:var(--fg);font-size:13px;cursor:pointer"><span>Light mode</span><span style="position:relative;width:34px;height:18px;border-radius:999px;background:{{ switchBg }};transition:background .2s"><span style="position:absolute;top:2px;left:{{ knobLeft }};width:14px;height:14px;border-radius:50%;background:{{ knobBg }};transition:left .2s"></span></span></button>
</div>
</aside>

<main style="flex:1;min-width:0;overflow:auto">
<div style="max-width:1240px;margin:0 auto;padding:28px 32px 56px;display:flex;flex-direction:column;gap:20px">

<sc-if value="{{ isToday }}" hint-placeholder-val="{{ true }}">
<header style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;color:var(--mute)">{{ dateLine }}</div><div style="font-family:Archivo;font-stretch:125%;font-weight:400;font-size:38px;letter-spacing:-.01em;line-height:1">{{ vdLabel }}</div></div>
<div style="display:flex;align-items:center;gap:14px">
<div style="font-size:13px;color:var(--mute)">{{ leftText }}</div>
<div style="display:flex;gap:4px">
<button onClick="{{ onPrevDay }}" title="Previous day" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--ctlB);background:var(--ctl);color:var(--fg);font-size:16px;cursor:pointer">‹</button>
<sc-if value="{{ notToday }}"><button onClick="{{ onToday }}" style="height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ctlB);background:var(--ctl);color:var(--fg);font-size:13px;cursor:pointer">Today</button></sc-if>
<button onClick="{{ onNextDay }}" title="Next day" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--ctlB);background:var(--ctl);color:var(--fg);font-size:16px;cursor:pointer;opacity:{{ nextOpacity }}">›</button>
</div>
</div>
</header>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
<div style="flex:1 1 640px;min-width:0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:32px;padding:20px 28px;border-radius:24px;background:var(--heroBg);border:1px solid var(--heroB);color:var(--heroFg)">
<div style="position:relative;width:124px;height:124px;flex:none">
<svg width="124" height="124" viewBox="0 0 168 168" style="transform:rotate(-90deg)"><circle cx="84" cy="84" r="74" style="fill:none;stroke:var(--heroTrack);stroke-width:9"></circle><circle cx="84" cy="84" r="74" style="fill:none;stroke:var(--heroAcc);stroke-width:9;stroke-linecap:round;stroke-dasharray:{{ scoreDash }};opacity:{{ scoreOp }};transition:stroke-dasharray .5s"></circle></svg>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:40px;line-height:1">{{ doneCount }}</div><div style="font-size:11px;letter-spacing:.12em;color:var(--heroMute)">OF 7</div></div>
</div>
<div style="display:flex;flex-direction:column;gap:16px;flex:1">
<div style="font-size:11px;letter-spacing:.14em;color:var(--heroMute)">DAILY SCORE</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:30px;line-height:1">{{ liveStreaks }}</div><div style="font-size:12px;color:var(--heroMute)">Live streaks</div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:30px;line-height:1">{{ topStreak }}<span style="font-size:14px;color:var(--heroMute)"> d</span></div><div style="font-size:12px;color:var(--heroMute)">Longest active</div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:30px;line-height:1;color:var(--heroAcc)">{{ prsOnLine }}</div><div style="font-size:12px;color:var(--heroMute)">PRs on the line</div></div>
</div>
</div>
</div>
<div style="padding:10px;border-radius:24px;background:var(--card);border:1px solid var(--cardB);display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ habits }}" as="h" hint-placeholder-count="7">
<div style="display:grid;grid-template-columns:46px minmax(0,1fr) 104px 56px 156px;gap:12px;align-items:center;padding:6px 12px;border-radius:16px;background:{{ h.rowBg }};transition:background .2s">
<div title="{{ h.ringTitle }}" style="position:relative;width:46px;height:46px"><svg width="46" height="46" viewBox="0 0 48 48" style="transform:rotate(-90deg)"><circle cx="24" cy="24" r="20" style="fill:none;stroke:var(--track);stroke-width:3.5"></circle><circle cx="24" cy="24" r="20" style="fill:none;stroke:{{ h.ring }};stroke-width:3.5;stroke-linecap:round;stroke-dasharray:{{ h.dash }};opacity:{{ h.ringOp }};transition:all .4s"></circle></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums">{{ h.cur }}</div></div>
<div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ h.name }}</div><div style="font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ h.sub }}</div></div>
<div style="display:flex;gap:5px"><sc-for list="{{ h.days }}" as="x"><div title="{{ x.title }}" style="width:11px;height:11px;border-radius:50%;box-sizing:border-box;background:{{ x.bg }};border:1.5px solid {{ x.border }}"></div></sc-for></div>
<div style="font-size:11px;letter-spacing:.06em;font-weight:600;color:{{ h.prFg }}">{{ h.prLabel }}</div>
<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px">
<sc-if value="{{ h.isToggle }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:var(--mute);white-space:nowrap">{{ h.weekLabel }}</span><button onClick="{{ h.onToggle }}" style="min-width:80px;height:36px;padding:0 14px;white-space:nowrap;border-radius:999px;border:1px solid {{ h.btnBorder }};background:{{ h.btnBg }};color:{{ h.btnFg }};font-size:13px;font-weight:600;cursor:pointer;transition:all .2s">{{ h.btnLabel }}</button></sc-if>
<sc-if value="{{ h.isSleep }}"><input type="number" step="0.1" min="0" max="16" placeholder="0.0" value="{{ sleepRaw }}" onChange="{{ onSleep }}" style="width:80px;height:36px;box-sizing:border-box;padding:0 12px;border-radius:999px;border:1px solid {{ h.inBorder }};background:{{ h.inBg }};color:{{ h.inFg }};font-size:15px;font-weight:600;text-align:center"><span style="font-size:12px;color:var(--mute)">hrs</span></sc-if>
<sc-if value="{{ h.isNet }}"><span style="font-size:12px;color:var(--mute);white-space:nowrap">{{ h.netCount }}</span><button onClick="{{ toggleNetForm }}" style="height:36px;padding:0 14px;white-space:nowrap;border-radius:999px;border:1px solid {{ h.btnBorder }};background:{{ h.btnBg }};color:{{ h.btnFg }};font-size:13px;font-weight:600;cursor:pointer">+ Outreach</button></sc-if>
</div>
</div>
<sc-if value="{{ h.showNetForm }}">
<div style="display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px 70px">
<sc-for list="{{ outreachToday }}" as="o"><div style="font-size:13px;display:flex;gap:10px"><span style="color:var(--acc)">✓</span><span>{{ o.name }}</span><span style="color:var(--mute)">{{ o.company }}</span></div></sc-for>
<div style="display:flex;gap:8px"><input placeholder="Contact name" value="{{ netName }}" onChange="{{ onNetName }}" onKeyDown="{{ onNetKey }}" style="flex:1;min-width:0;height:36px;padding:0 14px;border-radius:999px;font-size:13px;border:1px solid var(--ctlB);background:var(--input);color:var(--fg)"><input placeholder="Company" value="{{ netCo }}" onChange="{{ onNetCo }}" onKeyDown="{{ onNetKey }}" style="flex:1;min-width:0;height:36px;padding:0 14px;border-radius:999px;font-size:13px;border:1px solid var(--ctlB);background:var(--input);color:var(--fg)"><button onClick="{{ onAddOutreach }}" style="height:36px;padding:0 18px;border-radius:999px;border:0;background:var(--strong);color:var(--onStrong);font-size:13px;font-weight:600;cursor:pointer">Log</button></div>
<div style="font-size:12px;color:var(--mute)">Saved to Networking as "Reached out".</div>
</div>
</sc-if>
</sc-for>
</div>
</div>
<div style="flex:1 1 300px;max-width:100%;border-radius:24px;background:var(--card);border:1px solid var(--cardB);display:flex;flex-direction:column;overflow:hidden">
<div style="padding:22px 22px 14px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:Archivo;font-stretch:125%;font-weight:400;font-size:20px">Tasks</div><div style="font-size:13px;color:var(--mute)">{{ taskDone }} of {{ taskTotal }}</div></div>
<div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ filters }}" as="f" hint-placeholder-count="5"><button onClick="{{ f.onClick }}" style="display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};font-size:12px;font-weight:500;cursor:pointer"><span style="width:6px;height:6px;border-radius:50%;background:{{ f.color }}"></span>{{ f.label }} <span style="opacity:.6">{{ f.count }}</span></button></sc-for></div>
</div>
<div style="display:flex;flex-direction:column;padding:0 10px">
<sc-for list="{{ visibleTasks }}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-top:1px solid var(--line)">
<button onClick="{{ t.onToggle }}" style="width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid {{ t.boxBorder }};background:{{ t.box }};color:var(--onAcc);font-size:11px;font-weight:700;line-height:1;padding:0;cursor:pointer">{{ t.mark }}</button>
<div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0"><div style="font-size:14px;color:{{ t.fg }};text-decoration:{{ t.deco }};text-wrap:pretty">{{ t.text }}</div><div style="display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:var(--mute)"><span style="width:6px;height:6px;border-radius:50%;background:{{ t.color }}"></span>{{ t.tagLabel }}</div></div>
<button onClick="{{ t.onRemove }}" title="Delete" style="border:0;background:none;color:var(--mute);font-size:16px;cursor:pointer;padding:0 2px">×</button>
</div>
</sc-for>
<sc-if value="{{ tasksEmpty }}"><div style="padding:22px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)">Nothing here yet. Add what today needs.</div></sc-if>
</div>
<div style="display:flex;gap:6px;padding:14px;margin-top:4px;border-top:1px solid var(--line)">
<input placeholder="Add a task…" value="{{ newText }}" onChange="{{ onNewText }}" onKeyDown="{{ onNewKey }}" style="flex:1;min-width:0;height:36px;padding:0 14px;border-radius:999px;font-size:13px;border:1px solid var(--ctlB);background:var(--input);color:var(--fg)">
<select value="{{ newTag }}" onChange="{{ onNewTag }}" style="height:36px;padding:0 10px;border-radius:999px;font-size:12px;border:1px solid var(--ctlB);background:var(--select);color:var(--fg)"><option value="work">Work</option><option value="school">School</option><option value="personal">Personal</option><option value="other">Other</option></select>
<button onClick="{{ onAddTask }}" title="Add task" style="width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--acc);color:var(--onAcc);font-size:18px;cursor:pointer">+</button>
</div>
<sc-if value="{{ hasCompleted }}"><button onClick="{{ onClearDone }}" style="margin:0 14px 14px;align-self:flex-start;border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;padding:0">Clear completed</button></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ isTrends }}">
<header style="display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;color:var(--mute)">Last 52 weeks</div><div style="font-family:Archivo;font-stretch:125%;font-weight:400;font-size:38px;letter-spacing:-.01em;line-height:1">Trends</div></header>
<div style="padding:22px 24px;border-radius:24px;background:var(--heroBg);border:1px solid var(--heroB);color:var(--heroFg);display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:11px;letter-spacing:.14em;color:var(--heroMute)">SCOREBOARD · CURRENT STREAK / PR</div><div style="font-size:12px;color:var(--heroMute)">Workout counts weeks with 5+ sessions</div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">
<sc-for list="{{ board }}" as="b" hint-placeholder-count="7">
<div style="padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px">
<div style="font-size:12px;color:var(--heroMute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.name }}</div>
<div style="display:flex;align-items:baseline;gap:4px"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums">{{ b.cur }}</div><div style="font-size:12px;color:var(--heroMute)">{{ b.unit }}</div></div>
<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.06em;font-weight:600"><span style="color:{{ b.prFg }}">{{ b.prLabel }}</span><span style="color:var(--heroMute);font-weight:400">{{ b.prUnit }}</span></div>
</div>
</sc-for>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
<sc-for list="{{ charts }}" as="c" hint-placeholder-count="3">
<div style="padding:20px 20px 16px;border-radius:24px;background:var(--card);border:1px solid var(--cardB);display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:15px;font-weight:500">{{ c.title }}</div><div style="font-size:12px;color:var(--mute)">{{ c.sub }}</div></div><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:28px;line-height:1">{{ c.latest }}</div></div>
<svg viewBox="0 0 320 120" style="width:100%;height:auto;display:block">
<line x1="12" x2="308" y1="{{ c.targetY }}" y2="{{ c.targetY }}" style="stroke:var(--mute);stroke-width:1;stroke-dasharray:3 4"></line>
<line x1="12" x2="308" y1="108" y2="108" style="stroke:var(--line);stroke-width:1"></line>
<polyline points="{{ c.points }}" style="fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"></polyline>
<sc-for list="{{ c.dots }}" as="p"><circle cx="{{ p.cx }}" cy="{{ p.cy }}" r="3.2" style="fill:var(--bg);stroke:var(--acc);stroke-width:2"></circle></sc-for>
</svg>
<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mute)"><span>{{ weekAxisStart }}</span><span>{{ c.targetLabel }}</span><span>This week</span></div>
</div>
</sc-for>
</div>
<div style="padding:22px 24px;border-radius:24px;background:var(--card);border:1px solid var(--cardB);display:flex;flex-direction:column;gap:18px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:15px;font-weight:500">Consistency score</div><div style="font-size:12px;color:var(--mute)">Share of all 7 habits completed, by week</div></div>
<div style="display:flex;gap:28px">
<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:30px;line-height:1">{{ thisWeekScore }}</div><div style="font-size:12px;color:var(--mute)">This week</div></div>
<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:30px;line-height:1">{{ consistency30 }}{{ consistencyUnit }}</div><div style="font-size:12px;color:var(--mute)">30 days</div></div>
<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><div style="font-family:Archivo;font-stretch:125%;font-weight:300;font-size:30px;line-height:1;color:var(--acc)">{{ bestWeek }}</div><div style="font-size:12px;color:var(--mute)">Best week</div></div>
</div>
</div>
<div style="display:flex;align-items:flex-end;gap:6px;height:140px">
<sc-for list="{{ consistBars }}" as="cb" hint-placeholder-count="26">
<div title="{{ cb.title }}" style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;align-items:center"><div style="font-size:10px;color:var(--mute)">{{ cb.label }}</div><div style="width:100%;height:{{ cb.h }};min-height:3px;border-radius:6px;background:{{ cb.bg }};transition:height .4s"></div></div>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mute)"><span>{{ consistAxisStart }}</span><span>This week</span></div>
</div>
<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ heat }}" as="hm" hint-placeholder-count="7">

<script type="text/x-dc" data-dc-script>
const KEY='splits.v1';
const HABITS=[{key:'sleep',name:'Sleep',rule:'≥ 8 hours'},{key:'eat',name:'Eat healthy',rule:'Check'},{key:'spend',name:'No unnecessary spending',rule:'Check'},{key:'net',name:'Networking',rule:'≥ 1 new outreach'},{key:'news',name:'News',rule:'Read or listen'},{key:'reading',name:'Reading',rule:'Check'},{key:'workout',name:'Workout',rule:'5 per week'}];
const TAGS={work:{label:'Work',color:'oklch(0.7 0.11 250)'},school:{label:'School',color:'oklch(0.7 0.11 155)'},personal:{label:'Personal',color:'oklch(0.7 0.11 340)'},other:{label:'Other',color:'oklch(0.7 0.02 260)'}};
const LIGHT={'--bg':'#E8E1D5','--glow1':'#F6F0E6','--glow2':'#DCD2C2','--fg':'#24211D','--mute':'#6E675D','--card':'rgba(255,255,255,.42)','--cardB':'rgba(36,33,29,.07)','--line':'rgba(36,33,29,.08)','--ctl':'rgba(255,255,255,.55)','--ctlB':'rgba(36,33,29,.16)','--input':'rgba(255,255,255,.7)','--select':'#F6F1E9','--track':'rgba(36,33,29,.09)','--heatMiss':'rgba(36,33,29,.28)','--past':'rgba(36,33,29,.72)','--acc':'oklch(0.52 0.1 48)','--onAcc':'#FBF7F0','--miss':'oklch(0.55 0.15 28)','--rowOn':'rgba(255,255,255,.62)','--heroBg':'#24211D','--heroB':'#24211D','--heroFg':'#F3EEE5','--heroMute':'rgba(243,238,229,.62)','--heroAcc':'oklch(0.75 0.1 60)','--heroTrack':'rgba(243,238,229,.12)','--navOnBg':'#24211D','--navOnFg':'#F3EEE5','--navDot':'oklch(0.75 0.1 60)','--strong':'#24211D','--onStrong':'#F3EEE5'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const todayKey=()=>toKey(new Date());
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return toKey(d);};
const weekStart=k=>{const d=parse(k);d.setDate(d.getDate()-(d.getDay()+6)%7);return toKey(d);};
const fmtShort=k=>{const d=parse(k);return MON[d.getMonth()]+' '+d.getDate();};
const isoWeek=k=>{const d=parse(k);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7);};
const uid=()=>Math.random().toString(36).slice(2,10);
const pct=v=>Math.round(v*100)+'%';
const defaults=()=>({logs:{},contacts:[],tasks:[],goals:[{id:'internship',title:'Summer 2027 Internship',due:'Summer 2027',funnel:true,apps:0,interviews:0,offers:0,milestones:[]}],theme:'dark'});
const load=()=>{let d=defaults();try{const r=localStorage.getItem(KEY);if(r)d={...d,...JSON.parse(r)};}catch(e){}return d;};
const T0=todayKey();
class Component extends DCLogic {
  state={data:load(),tab:'today',vd:T0,netName:'',netCo:'',netOpen:false,filter:'all',newText:'',newTag:'school',cName:'',cCo:'',cDate:T0,cStatus:'reached',cNotes:'',cFilter:'all',cSearch:'',ms:{},gTitle:'',gDue:'',weeksShown:6};
  componentDidMount(){this.syncBody();}
  componentDidUpdate(pp,ps){if(ps.data!==this.state.data){try{localStorage.setItem(KEY,JSON.stringify(this.state.data));}catch(e){}}this.syncBody();}
  syncBody(){const light=this.state.data.theme==='light';document.body.style.background=light?'#E8E1D5':'#131418';document.documentElement.style.colorScheme=light?'light':'dark';}
  upd=fn=>this.setState(s=>({data:fn(s.data)}));
  setLog=(k,patch)=>this.upd(d=>({...d,logs:{...d.logs,[k]:{...(d.logs[k]||{}),...patch}}}));
  updGoal=(id,fn)=>this.upd(d=>({...d,goals:d.goals.map(g=>g.id===id?fn(g):g)}));
